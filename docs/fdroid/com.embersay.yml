    en-US: Groq, OpenAI, Anthropic and Tinfoil are optional network services, used only
      when you set them up with your own key and choose them. Speech models are
      downloaded on request from Hugging Face and keyboard.futo.org. Recognition on the
      phone and on your own server works without any of them.
