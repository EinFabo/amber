name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Builds and tests only; no secrets, nothing published. Actions are pinned by commit, since a
# tag can be moved to other code after the fact.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The default package list still names "tools", which current sdkmanager no
        # longer knows - the step would fail before anything is built.
        with:
          packages: platform-tools

      - name: Install SDK packages
        # NDK and CMake for whisper.cpp and sherpa-onnx; versions match app/build.gradle.kts.
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Tinfoil's attestation verifier is bound from tinfoil-go with gomobile; its go.mod
      # names the Go version; the source is the submodule third_party/tinfoil-go (checkout
      # fetches it recursively), and a Go that already is that version is used without a download.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.3'
          # There is no go.sum at the root to key a cache on; tinfoil-go is built fresh.
          cache: false

      # The runner exports its own default NDK as ANDROID_NDK_HOME; the AAR is built with the
      # pinned one (the script refuses another revision when CI=true).
      - name: Build Tinfoil verifier AAR
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" tools/build-tinfoil-aar.sh

      # :core is pure JVM and holds the engine, splicing and VAD logic, so this is the
      # step that actually proves behaviour. It also runs locally without an Android SDK.
      # Catches typo-level breakage in :app (imports, R.* ids, manifest classes) even when
      # the Android build itself cannot run.
      - name: Check internal references
        run: python3 -I tools/check_refs.py

      # English and German alike, and no English sentence left in a screen's code.
      - name: Check app texts
        run: python3 -I tools/check_strings.py

      - name: Core unit tests
        run: ./gradlew :core:test

      # Independent of the SDK: checks the non-Compose Android sources against real
      # framework classes from Maven Central. Keeps working even if the Android build
      # breaks for an unrelated reason.
      - name: Type-check Android sources against android-all
        run: tools/typecheck-android.sh

      # Blocking: findings from before are in app/lint-baseline.xml, a new error or warning fails the build.
      - name: Lint
        run: ./gradlew :app:lintDebug

      # The JVM tests of :app: what needs Android classes, run under Robolectric.
      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # Unsigned: signing happens on the signing host, never here. A rebuild of this commit
      # anywhere else must give the same SHA-256 (README, "Reproducible builds").
      - name: Assemble release APK (unsigned)
        run: |
          ./gradlew :app:assembleRelease
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embersay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload app test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
