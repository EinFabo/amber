name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Builds and tests only; no secrets, nothing published. Actions are pinned by commit, since a
# tag can be moved to other code after the fact.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK packages
        # NDK and CMake for whisper.cpp; versions match app/build.gradle.kts.
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Tinfoil's attestation verifier is bound from tinfoil-go with gomobile; its go.mod
      # names the Go version.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'

      - name: Build Tinfoil verifier AAR
        run: tools/build-tinfoil-aar.sh

      - name: Fetch sherpa-onnx AAR
        run: tools/fetch-sherpa-aar.sh

      # :core is pure JVM and holds the engine, splicing and VAD logic, so this is the
      # step that actually proves behaviour. It also runs locally without an Android SDK.
      # Catches typo-level breakage in :app (imports, R.* ids, manifest classes) even when
      # the Android build itself cannot run.
      - name: Check internal references
        run: python3 -I tools/check_refs.py

      - name: Core unit tests
        run: ./gradlew :core:test

      # Independent of the SDK: checks the non-Compose Android sources against real
      # framework classes from Maven Central. Keeps working even if the Android build
      # breaks for an unrelated reason.
      - name: Type-check Android sources against android-all
        run: tools/typecheck-android.sh

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amber-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
