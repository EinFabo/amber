name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core is pure JVM and holds the engine, splicing and VAD logic, so this is the
      # step that actually proves behaviour. It also runs locally without an Android SDK.
      # Catches typo-level breakage in :app (imports, R.* ids, manifest classes) even when
      # the Android build itself cannot run.
      - name: Check internal references
        run: python3 -I tools/check_refs.py

      - name: Core unit tests
        run: ./gradlew :core:test

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
